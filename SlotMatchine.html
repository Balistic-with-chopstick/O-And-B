<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slot Machine Lets Go Gambling</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Shade&display=swap');

    * { box-sizing: border-box; }

    body {
      background: #0f0f0f;
      background-image: radial-gradient(ellipse at 50% 0%, #2a1a00 0%, #0f0f0f 65%);
      color: #fff;
      font-family: 'Bungee', 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }

    /* ── Machine + lever wrapper ── */
    .machine-wrap {
      display: flex;
      align-items: center;
      gap: 0;
      position: relative;
    }

    /* ── Lever housing (bolted to side of machine) ── */
    .lever-housing {
      width: 36px;
      height: 180px;
      align-self: center; /* centers vertically against the slot machine */
      background: linear-gradient(180deg, #2a2a2a, #111);
      border-radius: 0 14px 14px 0;
      border: 2px solid #3a3a3a;
      border-left: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12px;
      position: relative;
      box-shadow: 4px 0 18px #000a, inset -1px 0 0 #ffffff10;
      perspective: 220px;
    }

    /* Pivot at the vertical center of the housing (90px from top) */
    .lever-pivot {
      width: 14px;
      height: 14px;
      background: radial-gradient(circle at 40% 35%, #ccc, #555);
      border-radius: 50%;
      border: 2px solid #999;
      box-shadow: 0 3px 8px #000, inset 0 1px 0 #fff5;
      position: absolute;
      top: 83px; /* center of 180px housing */
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
    }

    /* The lever arm — pivot at BOTTOM, ball swings forward from top */
    .lever-arm {
      position: absolute;
      top: calc(90px - 115px); /* 115px = stick(95) + half-ball(20) above pivot */
      left: 50%;
      transform-origin: bottom center;
      transform: translateX(-50%) rotateX(0deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transform-style: preserve-3d;
    }
    .lever-arm:active { cursor: grabbing; }
    .lever-arm.snapping {
      transition: transform 0.32s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .lever-arm.returning {
      transition: transform 0.55s cubic-bezier(0.34, 1.5, 0.64, 1);
    }

    /* Stick — longer, wider near ball (top), narrower at hinge (bottom) */
    .lever-stick {
      width: 9px;
      height: 95px;
      background: linear-gradient(90deg, #666, #ddd 40%, #999 70%, #555);
      border-radius: 5px;
      box-shadow: 2px 2px 8px #000a, -1px 0 0 #fff2 inset;
      flex-shrink: 0;
      clip-path: polygon(0% 0%, 100% 0%, 85% 100%, 15% 100%);
    }

    /* Ball knob at end of stick */
    .lever-ball {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 28%, #ff6666, #cc0000 55%, #880000);
      box-shadow: 0 6px 18px #ff000077, 0 2px 0 #ff888855 inset, 0 -2px 4px #0006 inset;
      border: 2px solid #aa0000;
      flex-shrink: 0;
      order: -1; /* ball on top */
      margin-bottom: 0;
      /* shiny specular dot */
      position: relative;
    }
    .lever-ball::after {
      content: '';
      position: absolute;
      top: 20%;
      left: 22%;
      width: 30%;
      height: 20%;
      background: radial-gradient(ellipse, #fff9 0%, transparent 100%);
      border-radius: 50%;
      transform: rotate(-30deg);
    }

    /* Pulled state glow */
    .lever-ball.pulled {
      box-shadow: 0 6px 28px #ff0000bb, 0 0 40px #ff444477, 0 2px 0 #ff888855 inset;
    }

    /* Arc groove — decorative track behind the lever */
    .lever-groove {
      position: absolute;
      top: 16px;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      background: #080808;
      border-radius: 3px;
      border: 1px solid #444;
      box-shadow: inset 0 2px 6px #000;
    }

    /* PULL label */
    .lever-label {
      position: absolute;
      bottom: 6px;
      font-size: 0.42rem;
      color: #ffcc3366;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* Disabled state */
    .lever-housing.disabled .lever-arm {
      opacity: 0.45;
      pointer-events: none;
      cursor: not-allowed;
    }

    h1 {
      font-family: 'Bungee Shade', cursive;
      font-size: 2.4rem;
      letter-spacing: 2px;
      color: #ffcc33;
      text-shadow: 0 0 24px #ffb34780, 0 2px 0 #a06000;
      margin-bottom: 12px;
    }

    .slot-machine {
      display: grid;
      grid-template-rows: repeat(3, 100px);
      grid-template-columns: repeat(4, 100px);
      gap: 10px;
      background: linear-gradient(160deg, #2a2a2a, #111);
      border-radius: 20px;
      box-shadow: 0 8px 40px #000c, inset 0 1px 0 #ffffff18;
      padding: 20px;
      border: 2px solid #3a3a3a;
      margin-bottom: 0;
      position: relative;
    }

    .slot {
      width: 100px;
      height: 100px;
      background: #1c1c1c;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 8px #0009, 0 1px 0 #ffffff10;
      border: 1.5px solid #444;
      transition: border-color 0.3s, box-shadow 0.3s, filter 0.4s;
    }

    /* Win highlight states */
    .slot.win-3row {
      border-color: #00e5ff;
      box-shadow: 0 0 18px #00e5ff99, inset 0 0 12px #00e5ff22;
      animation: pulse-blue 1s ease-in-out infinite;
    }
    .slot.win-4row {
      border-color: #ff4cf5;
      box-shadow: 0 0 24px #ff4cf5bb, inset 0 0 16px #ff4cf533;
      animation: pulse-pink 0.8s ease-in-out infinite;
    }
    .slot.win-diag {
      border-color: #39ff14;
      box-shadow: 0 0 20px #39ff14aa, inset 0 0 14px #39ff1422;
      animation: pulse-green 0.9s ease-in-out infinite;
    }
    .slot.win-jackpot {
      border-color: #ffd700;
      box-shadow: 0 0 30px #ffd700cc, inset 0 0 20px #ffd70044;
      animation: pulse-gold 0.5s ease-in-out infinite;
    }
    .slot.win-3col {
      border-color: #ff8c00;
      box-shadow: 0 0 20px #ff8c00aa, inset 0 0 14px #ff8c0022;
      animation: pulse-orange 1s ease-in-out infinite;
    }
    .slot.dimmed {
      filter: brightness(0.35) saturate(0.3);
    }

    @keyframes pulse-blue   { 0%,100%{box-shadow:0 0 14px #00e5ff88} 50%{box-shadow:0 0 32px #00e5ffdd} }
    @keyframes pulse-pink   { 0%,100%{box-shadow:0 0 14px #ff4cf588} 50%{box-shadow:0 0 36px #ff4cf5ee} }
    @keyframes pulse-green  { 0%,100%{box-shadow:0 0 14px #39ff1488} 50%{box-shadow:0 0 34px #39ff14dd} }
    @keyframes pulse-gold   { 0%,100%{box-shadow:0 0 20px #ffd700aa} 50%{box-shadow:0 0 50px #ffd700ff,0 0 80px #ffb34766} }
    @keyframes pulse-orange { 0%,100%{box-shadow:0 0 14px #ff8c0088} 50%{box-shadow:0 0 32px #ff8c00ee} }

    .slot-strip {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      will-change: transform;
    }

    .slot-symbol {
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.6rem;
      flex-shrink: 0;
    }

    .slot::before, .slot::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 28px;
      z-index: 2;
      pointer-events: none;
    }
    .slot::before { top: 0;    background: linear-gradient(to bottom, #1c1c1cee, transparent); }
    .slot::after  { bottom: 0; background: linear-gradient(to top,   #1c1c1cee, transparent); }



    #winMsg {
      margin-top: 24px;
      min-height: 2.4rem;
      text-align: center;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .tag {
      display: inline-block;
      border-radius: 8px;
      padding: 5px 16px;
      font-size: 0.95rem;
      animation: popIn 0.4s cubic-bezier(.68,-0.55,.27,1.55) both;
    }
    .tag-3row    { background:#00e5ff18; color:#00e5ff; border:1.5px solid #00e5ff88; }
    .tag-4row    { background:#ff4cf518; color:#ff4cf5; border:1.5px solid #ff4cf588; }
    .tag-diag    { background:#39ff1418; color:#39ff14; border:1.5px solid #39ff1488; }
    .tag-3col    { background:#ff8c0018; color:#ff8c00; border:1.5px solid #ff8c0088; }
    .tag-jackpot {
      background: linear-gradient(90deg,#ffd70022,#ffb34722);
      color: #ffd700;
      border: 2px solid #ffd700;
      font-size: 1.2rem !important;
      text-shadow: 0 0 10px #ffd700;
      box-shadow: 0 0 20px #ffd70055;
    }

    @keyframes popIn {
      0%  { transform: scale(0.4) rotate(-5deg); opacity:0; }
      60% { transform: scale(1.1) rotate(2deg); }
      100%{ transform: scale(1) rotate(0deg);   opacity:1; }
    }

    /* Jackpot full-screen overlay */
    #jackpotOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000000dd;
      z-index: 100;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
    }
    #jackpotOverlay.active { display: flex; }

    #jackpotText {
      font-family: 'Bungee Shade', cursive;
      font-size: 5rem;
      color: #ffd700;
      text-shadow: 0 0 40px #ffd700, 0 0 80px #ffb347, 0 4px 0 #7a5000;
      letter-spacing: 6px;
      animation: jackpotBounce 0.55s ease-in-out infinite alternate;
    }
    #jackpotBigEmoji {
      font-size: 4rem;
      animation: spinEmoji 0.8s linear infinite;
    }
    #jackpotSub {
      font-size: 1.2rem;
      color: #fff8;
      letter-spacing: 2px;
    }
    #jackpotClose {
      margin-top: 12px;
      background: #ffd700;
      color: #1a0e00;
      border: none;
      border-radius: 8px;
      padding: 12px 40px;
      font-family: 'Bungee', sans-serif;
      font-size: 1rem;
      cursor: pointer;
      letter-spacing: 1px;
      box-shadow: 0 4px 20px #ffd70066;
      transition: transform 0.1s;
    }
    #jackpotClose:hover { transform: scale(1.05); }

    @keyframes jackpotBounce {
      from { transform: scale(1) rotate(-2deg); }
      to   { transform: scale(1.08) rotate(2deg); }
    }
    @keyframes spinEmoji {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Legend */
    #legend {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      font-size: 0.7rem;
      opacity: 0.65;
      flex-wrap: wrap;
      justify-content: center;
    }
  </style>
</head>
<body>
  <h1>🎰 Slot Machine</h1>

  <div id="legend">
    <span class="tag tag-3col">3 DOWN</span>
    <span class="tag tag-3row">3 IN A ROW</span>
    <span class="tag tag-4row">4 IN A ROW</span>
    <span class="tag tag-diag">DIAGONAL</span>
    <span class="tag tag-jackpot">✨ JACKPOT</span>
  </div>

  <div class="machine-wrap">
    <div class="slot-machine" id="slotMachine"></div>
    <!-- Lever -->
    <div class="lever-housing" id="leverHousing">
      <div class="lever-groove"></div>
      <div class="lever-pivot"></div>
      <div class="lever-arm" id="leverArm">
        <div class="lever-ball" id="leverBall"></div>
        <div class="lever-stick"></div>
      </div>
      <div class="lever-label">PULL</div>
    </div>
  </div>

  <div id="winMsg"></div>

  <!-- Jackpot overlay -->
  <div id="jackpotOverlay">
    <div id="jackpotText">JACKPOT!</div>
    <div id="jackpotBigEmoji">🌟</div>
    <div id="jackpotSub">ALL 12 MATCH!</div>
    <button id="jackpotClose">✨ COLLECT ✨</button>
  </div>

  <script>
    const IMAGES = [
      '🍒','🍋','🍉','🍇','🍓','🍊','🍌','🍍',
      '🥝','🥥','🥭','🍏','🍎','🍐','🍑','🍈',
      '🍔','🍕','🍩','🍪','🍫','🍿','🍦','🍭'
    ];

    const ROWS = 3, COLS = 4, ITEM_H = 100, SPIN_SYMBOLS = 18;

    // Each combo rolls independently — multiple can fire in one spin!
    const P_JACKPOT      = 0.02;   // 2%  – very rare
    const P_FAKE_JACKPOT = 0.08;   // 8%  – fake jackpot (3 cols match, 1 random)
    const P_4ROW    = 0.06;   // 6%  per row
    const P_DIAG    = 0.08;   // 8%  per diagonal
    const P_3ROW    = 0.18;   // 18% per row  → usually only 1 row fires
    const P_3COL    = 0.20;   // 20% per col  → usually only 1 col fires

    const slotMachine    = document.getElementById('slotMachine');
    const winMsg         = document.getElementById('winMsg');
    const jackpotOverlay = document.getElementById('jackpotOverlay');
    const jackpotBigEmoji= document.getElementById('jackpotBigEmoji');
    const jackpotSub     = document.getElementById('jackpotSub');
    const leverHousing   = document.getElementById('leverHousing');
    const leverArm       = document.getElementById('leverArm');
    const leverBall      = document.getElementById('leverBall');

    // Lever rotation: negative rotateX tips the ball TOWARD viewer (pull down = forward arc)
    // Pivot is at center of housing, ball swings forward from top
    const LEVER_MIN_DEG  = 0;    // upright resting
    const LEVER_MAX_DEG  = -38;  // shorter pull distance
    const TRIGGER_DEG    = -22;  // fire threshold
    let currentDeg  = 0;
    let dragStartY  = 0;
    let isDragging  = false;
    let spinning    = false;
    const DEG_PER_PX = 0.40;

    document.getElementById('jackpotClose').addEventListener('click', () => {
      jackpotOverlay.classList.remove('active');
    });

    // ── Build grid ────────────────────────────────────────────────
    for (let i = 0; i < ROWS * COLS; i++) {
      const cell  = document.createElement('div');
      cell.className = 'slot';
      const strip = document.createElement('div');
      strip.className = 'slot-strip';
      const face  = document.createElement('div');
      face.className = 'slot-symbol';
      face.textContent = IMAGES[Math.floor(Math.random() * IMAGES.length)];
      strip.appendChild(face);
      cell.appendChild(strip);
      slotMachine.appendChild(cell);
    }

    // ── Helpers ───────────────────────────────────────────────────
    const rand  = () => Math.random();
    const pick  = () => IMAGES[Math.floor(rand() * IMAGES.length)];
    const toGrid = flat => {
      const g = [];
      for (let r = 0; r < ROWS; r++) g.push(flat.slice(r*COLS, (r+1)*COLS));
      return g;
    };
    const flatIdx = (r, c) => r * COLS + c;
    const sleep = ms => new Promise(res => setTimeout(res, ms));

    // ── Fake jackpot builder ──────────────────────────────────────
    // 3 columns all share one emoji, the 4th column is random
    // The "odd" column can accidentally match the jackpot sym → 4-in-a-row is legit
    function buildFakeJackpot() {
      const sym = pick();
      const oddCol = Math.floor(rand() * COLS); // which column is the odd one out
      const flat = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (c === oddCol) {
            // Random symbol — may or may not match sym
            flat.push(pick());
          } else {
            flat.push(sym);
          }
        }
      }
      return flat;
    }

    // ── Multi-combo result builder ────────────────────────────────
    // Each combo rolls INDEPENDENTLY — many can stack in one spin!
    function buildResults() {
      // Jackpot first (overrides everything)
      if (rand() < P_JACKPOT) {
        const sym = pick();
        return { type: 'jackpot', flat: Array(ROWS * COLS).fill(sym) };
      }

      // Fake jackpot — 3 columns identical, 1 column random
      if (rand() < P_FAKE_JACKPOT) {
        return { type: 'fakejackpot', flat: buildFakeJackpot() };
      }

      // Start with a fully random grid, then stamp combos on top
      const flat = Array.from({ length: ROWS * COLS }, pick);

      // Track how many combos have fired — once one fires, extras are much less likely
      let combosUsed = 0;
      const comboChance = () => combosUsed === 0 ? 1.0 : (combosUsed === 1 ? 0.18 : 0.05);

      // ── 3-col: each column independently rolls ────────────────
      for (let c = 0; c < COLS; c++) {
        if (rand() < P_3COL * comboChance()) {
          const sym = pick();
          for (let r = 0; r < ROWS; r++) flat[flatIdx(r, c)] = sym;
          combosUsed++;
        }
      }

      // ── 3-row or 4-row: each row rolls independently ──────────
      for (let r = 0; r < ROWS; r++) {
        if (rand() < P_4ROW * comboChance()) {
          const sym = pick();
          for (let c = 0; c < COLS; c++) flat[flatIdx(r, c)] = sym;
          combosUsed++;
        } else if (rand() < P_3ROW * comboChance()) {
          const start = Math.floor(rand() * (COLS - 2));
          const sym   = pick();
          flat[flatIdx(r, start)]   = sym;
          flat[flatIdx(r, start+1)] = sym;
          flat[flatIdx(r, start+2)] = sym;
          const fourthCol = start === 0 ? 3 : 0;
          if (flat[flatIdx(r, fourthCol)] === sym) {
            let diff = pick();
            while (diff === sym) diff = pick();
            flat[flatIdx(r, fourthCol)] = diff;
          }
          combosUsed++;
        }
      }

      // ── Diagonal: each diagonal rolls independently ───────────
      const diagOptions = [];
      for (let r = 0; r <= ROWS-3; r++) {
        for (let c = 0; c <= COLS-3; c++)
          diagOptions.push([[r,c],[r+1,c+1],[r+2,c+2]]);
        for (let c = COLS-1; c >= 2; c--)
          diagOptions.push([[r,c],[r+1,c-1],[r+2,c-2]]);
      }
      for (const diag of diagOptions) {
        if (rand() < P_DIAG * comboChance()) {
          const sym = pick();
          diag.forEach(([r,c]) => { flat[flatIdx(r,c)] = sym; });
          combosUsed++;
        }
      }

      return { type: 'multi', flat };
    }

    // ── Pattern detection ─────────────────────────────────────────
    function detectPatterns(flat) {
      const g        = toGrid(flat);
      const cells3   = new Set();
      const cells4   = new Set();
      const cellsDiag= new Set();
      const cells3col= new Set();
      const tags     = [];

      for (let r = 0; r < ROWS; r++) {
        if (g[r][0] && g[r].every(v => v === g[r][0])) {
          [0,1,2,3].forEach(c => cells4.add(flatIdx(r,c)));
          if (!tags.includes('4row')) tags.push('4row');
        }
      }

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c <= COLS-3; c++) {
          const sym = g[r][c];
          if (sym && g[r][c+1] === sym && g[r][c+2] === sym) {
            const isFour = g[r].every(v => v === sym);
            if (!isFour) {
              [c,c+1,c+2].forEach(dc => cells3.add(flatIdx(r, dc)));
              if (!tags.includes('3row')) tags.push('3row');
            }
          }
        }
      }

      const addDiag = cells => { cells.forEach(i => cellsDiag.add(i)); if (!tags.includes('diag')) tags.push('diag'); };
      for (let r = 0; r <= ROWS-3; r++) {
        for (let c = 0; c <= COLS-3; c++) {
          const sym = g[r][c];
          if (sym && g[r+1][c+1] === sym && g[r+2][c+2] === sym)
            addDiag([flatIdx(r,c), flatIdx(r+1,c+1), flatIdx(r+2,c+2)]);
        }
        for (let c = COLS-1; c >= 2; c--) {
          const sym = g[r][c];
          if (sym && g[r+1][c-1] === sym && g[r+2][c-2] === sym)
            addDiag([flatIdx(r,c), flatIdx(r+1,c-1), flatIdx(r+2,c-2)]);
        }
      }

      for (let c = 0; c < COLS; c++) {
        const sym = g[0][c];
        if (sym && g[1][c] === sym && g[2][c] === sym) {
          [0,1,2].forEach(r => cells3col.add(flatIdx(r, c)));
          if (!tags.includes('3col')) tags.push('3col');
        }
      }

      const allWin = new Set([...cells3, ...cells4, ...cellsDiag, ...cells3col]);
      return { cells3, cells4, cellsDiag, cells3col, allWin, tags };
    }

    // ── Highlight helpers ─────────────────────────────────────────
    function clearHighlights() {
      slotMachine.querySelectorAll('.slot').forEach(s =>
        s.classList.remove('win-3row','win-4row','win-diag','win-jackpot','win-3col','dimmed'));
    }

    function applySet(cellSet, cls) {
      const slots = slotMachine.querySelectorAll('.slot');
      slots.forEach((slot, i) => {
        if (cellSet.has(i)) {
          slot.classList.remove('win-3row','win-diag','dimmed');
          slot.classList.add(cls);
        }
      });
    }

    function applyDimmed(allWinCells) {
      slotMachine.querySelectorAll('.slot').forEach((slot, i) => {
        if (!allWinCells.has(i)) slot.classList.add('dimmed');
      });
    }

    // ── Staged jackpot reveal ─────────────────────────────────────
    // Highlights: each column (3-down) → each row (4-in-a-row) → each diagonal → all gold
    async function stagedJackpotReveal(flat) {
      const slots = slotMachine.querySelectorAll('.slot');

      // Helper: flash a set of cells with a class, then return them to neutral after a beat
      function lightCells(indices, cls) {
        indices.forEach(i => {
          const s = slots[i];
          s.classList.remove('win-3col','win-4row','win-diag','win-jackpot','dimmed');
          s.classList.add(cls);
        });
        // After a short flash, return those cells to neutral (dimmed)
        setTimeout(() => {
          indices.forEach(i => {
            slots[i].classList.remove('win-3col','win-4row','win-diag');
            slots[i].classList.add('dimmed');
          });
        }, 220);
      }

      // Dim all first
      slots.forEach(s => s.classList.add('dimmed'));
      await sleep(300);

      // ── Step 1: highlight each column one at a time (3-down) ──
      for (let c = 0; c < COLS; c++) {
        const colCells = [0,1,2].map(r => flatIdx(r, c));
        lightCells(colCells, 'win-3col');
        await sleep(280);
      }
      addWinTag('3col');
      await sleep(400);

      // ── Step 2: highlight each row one at a time (4-in-a-row) ──
      for (let r = 0; r < ROWS; r++) {
        const rowCells = [0,1,2,3].map(c => flatIdx(r, c));
        lightCells(rowCells, 'win-4row');
        await sleep(280);
      }
      addWinTag('4row');
      await sleep(400);

      // ── Step 3: highlight each diagonal one at a time ──
      const diagOptions = [];
      for (let r = 0; r <= ROWS-3; r++) {
        for (let c = 0; c <= COLS-3; c++)
          diagOptions.push([[r,c],[r+1,c+1],[r+2,c+2]]);
        for (let c = COLS-1; c >= 2; c--)
          diagOptions.push([[r,c],[r+1,c-1],[r+2,c-2]]);
      }
      for (const diag of diagOptions) {
        lightCells(diag.map(([r,c]) => flatIdx(r,c)), 'win-diag');
        await sleep(260);
      }
      addWinTag('diag');
      await sleep(400);

      // ── Step 4: all gold jackpot ──
      slots.forEach(s => {
        s.classList.remove('win-3col','win-4row','win-diag','dimmed');
        s.classList.add('win-jackpot');
      });
      winMsg.innerHTML = `<span class="tag tag-jackpot" style="animation-delay:0s">✨ JACKPOT — ${flat[0]} EVERYWHERE! ✨</span>`;
      await sleep(700);

      jackpotBigEmoji.textContent = flat[0];
      jackpotSub.textContent = `ALL 12 ARE ${flat[0]}!`;
      jackpotOverlay.classList.add('active');
    }

    // ── Staged FAKE jackpot reveal ────────────────────────────────
    // Same flash sequence as real jackpot but only for the 3 matching cols.
    // Skips the odd column. Then falls through to normal win detection.
    async function stagedFakeJackpotReveal(flat) {
      const slots = slotMachine.querySelectorAll('.slot');
      const g = toGrid(flat);

      // Find the odd column (one that doesn't share the majority symbol)
      // The majority sym is whatever appears in col 0 row 0 unless it's the odd one
      // Find the sym that appears in 3 cols
      const colSyms = [];
      for (let c = 0; c < COLS; c++) colSyms.push(g[0][c]);
      const majSym = colSyms.find((s, _, arr) => arr.filter(x => x === s).length >= 3);
      const oddCol = colSyms.findIndex(s => s !== majSym);

      // The 3 matching column indices
      const matchCols = [0,1,2,3].filter(c => c !== oddCol);

      function lightCells(indices, cls) {
        indices.forEach(i => {
          const s = slots[i];
          s.classList.remove('win-3col','win-4row','win-diag','win-jackpot','dimmed');
          s.classList.add(cls);
        });
        setTimeout(() => {
          indices.forEach(i => {
            slots[i].classList.remove('win-3col','win-4row','win-diag');
            slots[i].classList.add('dimmed');
          });
        }, 220);
      }

      // Dim all first
      slots.forEach(s => s.classList.add('dimmed'));
      await sleep(300);

      // ── Step 1: flash each of the 3 matching columns (3-down) ──
      for (const c of matchCols) {
        const colCells = [0,1,2].map(r => flatIdx(r, c));
        lightCells(colCells, 'win-3col');
        await sleep(280);
      }
      addWinTag('3col');
      await sleep(400);

      // ── Step 2: flash each row — only the 3 matching cells per row (3-in-a-row) ──
      for (let r = 0; r < ROWS; r++) {
        const rowCells = matchCols.map(c => flatIdx(r, c));
        lightCells(rowCells, 'win-3row');
        await sleep(280);
      }
      addWinTag('3row');
      await sleep(400);

      // ── Step 3: flash diagonals within the 3 matching cols ──
      // Build diagonals that only touch matchCols
      const diagOptions = [];
      for (let r = 0; r <= ROWS-3; r++) {
        for (let c = 0; c <= COLS-3; c++) {
          const cells = [[r,c],[r+1,c+1],[r+2,c+2]];
          if (cells.every(([,col]) => matchCols.includes(col)))
            diagOptions.push(cells);
        }
        for (let c = COLS-1; c >= 2; c--) {
          const cells = [[r,c],[r+1,c-1],[r+2,c-2]];
          if (cells.every(([,col]) => matchCols.includes(col)))
            diagOptions.push(cells);
        }
      }
      for (const diag of diagOptions) {
        lightCells(diag.map(([r,c]) => flatIdx(r,c)), 'win-diag');
        await sleep(260);
      }
      if (diagOptions.length > 0) { addWinTag('diag'); await sleep(400); }

      // ── Clear all highlights then do normal win detection ──
      // (catches any legit 4-in-a-row if odd col accidentally matched)
      slots.forEach(s => s.classList.remove('win-3col','win-3row','win-4row','win-diag','win-jackpot','dimmed'));

      const { cells3, cells4, cellsDiag, cells3col, allWin } = detectPatterns(flat);
      if (allWin.size > 0) {
        applyDimmed(allWin);
        if (cells3col.size > 0) { applySet(cells3col, 'win-3col'); addWinTag('3col'); await sleep(350); }
        if (cells3.size  > 0)  { applySet(cells3,  'win-3row'); addWinTag('3row'); await sleep(350); }
        if (cellsDiag.size > 0) { applySet(cellsDiag, 'win-diag'); addWinTag('diag'); await sleep(350); }
        if (cells4.size  > 0)  { applySet(cells4,  'win-4row'); addWinTag('4row'); }
      }
    }
    const tagLabels = {
      '3col': ['tag-3col', '3 DOWN 🟠'],
      '3row': ['tag-3row', '3 IN A ROW 🔵'],
      '4row': ['tag-4row', '4 IN A ROW 💜'],
      'diag': ['tag-diag',  'DIAGONAL 🟢'],
    };
    let tagDelay = 0;
    function addWinTag(type) {
      const [cls, label] = tagLabels[type];
      const span = document.createElement('span');
      span.className = `tag ${cls}`;
      span.style.animationDelay = `${tagDelay}s`;
      span.textContent = label;
      winMsg.appendChild(span);
      tagDelay += 0.12;
    }

    // ── Animate a single reel strip ───────────────────────────────
    // FIX: finalSymbol is placed at index 0 (top of strip).
    // The strip starts translated DOWN to show the last random symbol,
    // then animates UP to translateY(0) which reveals index 0 = finalSymbol.
    function animateReel(strip, finalSymbol, delay) {
      return new Promise(resolve => {
        setTimeout(() => {
          // Build list: finalSymbol first, then random filler symbols
          const symbolList = [finalSymbol, ...Array.from({ length: SPIN_SYMBOLS }, pick)];

          strip.innerHTML = '';
          symbolList.forEach(s => {
            const div = document.createElement('div');
            div.className = 'slot-symbol';
            div.textContent = s;
            strip.appendChild(div);
          });

          // Start at the bottom (showing last symbol), then scroll up to index 0
          const totalHeight = (symbolList.length - 1) * ITEM_H;
          strip.style.transition = 'none';
          strip.style.transform  = `translateY(-${totalHeight}px)`;
          strip.getBoundingClientRect(); // force reflow

          const dur = 900 + (delay / 220) * 200;
          strip.style.transition = `transform ${dur}ms cubic-bezier(0.15,0.85,0.35,1.0)`;
          strip.style.transform  = 'translateY(0px)'; // lands on finalSymbol at index 0

          setTimeout(() => {
            // Clean up: leave only the final symbol
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.transform  = 'translateY(0)';
            const face = document.createElement('div');
            face.className = 'slot-symbol';
            face.textContent = finalSymbol;
            strip.appendChild(face);
            resolve();
          }, dur + 50);
        }, delay);
      });
    }

    // ── Main spin ─────────────────────────────────────────────────
    async function spinSlots() {
      if (spinning) return;
      spinning = true;
      leverHousing.classList.add('disabled');
      winMsg.innerHTML = '';
      tagDelay = 0;
      clearHighlights();

      const { type, flat } = buildResults();

      const slots    = slotMachine.querySelectorAll('.slot');
      const promises = [];
      slots.forEach((slot, i) => {
        const col   = i % COLS;
        const strip = slot.querySelector('.slot-strip');
        promises.push(animateReel(strip, flat[i], col * 220));
      });
      await Promise.all(promises);

      if (type === 'jackpot') {
        await stagedJackpotReveal(flat);
      } else if (type === 'fakejackpot') {
        await stagedFakeJackpotReveal(flat);
      } else {
        const { cells3, cells4, cellsDiag, cells3col, allWin } = detectPatterns(flat);

        if (allWin.size > 0) {
          applyDimmed(allWin);

          if (cells3col.size > 0) {
            applySet(cells3col, 'win-3col');
            addWinTag('3col');
            await sleep(350);
          }
          if (cells3.size > 0) {
            applySet(cells3, 'win-3row');
            addWinTag('3row');
            await sleep(350);
          }
          if (cellsDiag.size > 0) {
            applySet(cellsDiag, 'win-diag');
            addWinTag('diag');
            await sleep(350);
          }
          if (cells4.size > 0) {
            applySet(cells4, 'win-4row');
            addWinTag('4row');
          }
        }
      }

      spinning = false;
      leverHousing.classList.remove('disabled');
    }

    function setLeverDeg(deg, cls = null) {
      leverArm.classList.remove('snapping', 'returning');
      if (cls) leverArm.classList.add(cls);
      // Clamp between max (most negative) and min (0)
      currentDeg = Math.max(LEVER_MAX_DEG, Math.min(LEVER_MIN_DEG, deg));
      leverArm.style.transform = `translateX(-50%) rotateX(${currentDeg}deg)`;
      leverBall.classList.toggle('pulled', currentDeg <= TRIGGER_DEG);
    }

    function getClientY(e) {
      return e.touches ? e.touches[0].clientY : e.clientY;
    }

    leverArm.addEventListener('mousedown',  startDrag);
    leverArm.addEventListener('touchstart', startDrag, { passive: true });

    function startDrag(e) {
      if (spinning) return;
      isDragging = true;
      // currentDeg is negative, so divide by -DEG_PER_PX to get positive px offset
      dragStartY = getClientY(e) + currentDeg / DEG_PER_PX;
      leverArm.classList.remove('returning', 'snapping');
    }

    window.addEventListener('mousemove', onDrag);
    window.addEventListener('touchmove', onDrag, { passive: true });
    function onDrag(e) {
      if (!isDragging) return;
      const rawY = getClientY(e) - dragStartY;
      setLeverDeg(-rawY * DEG_PER_PX);

      // Auto-fire when lever hits the bottom — no need to let go
      if (currentDeg <= LEVER_MAX_DEG && !spinning) {
        isDragging = false;
        setLeverDeg(LEVER_MAX_DEG, 'snapping');
        setTimeout(() => {
          setLeverDeg(LEVER_MIN_DEG, 'returning');
          leverBall.classList.remove('pulled');
          spinSlots();
        }, 340);
      }
    }

    window.addEventListener('mouseup',  endDrag);
    window.addEventListener('touchend', endDrag);
    function endDrag() {
      if (!isDragging) return;
      isDragging = false;

      if (currentDeg <= TRIGGER_DEG && !spinning) {
        // Snap to full pull, then spring back and fire
        setLeverDeg(LEVER_MAX_DEG, 'snapping');
        setTimeout(() => {
          setLeverDeg(LEVER_MIN_DEG, 'returning');
          leverBall.classList.remove('pulled');
          spinSlots();
        }, 340);
      } else {
        // Didn't pull far enough — spring back
        setLeverDeg(LEVER_MIN_DEG, 'returning');
        leverBall.classList.remove('pulled');
      }
    }
  </script>
