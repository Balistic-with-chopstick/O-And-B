<!DOCTYPE html>
<html lang="en">
<head>
  <!-- O&B Game Saver — Exclusive Launcher (fixed UI, ~600 lines) -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>O&B Game Saver — Exclusive Launcher</title>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ============================================================
       O&B Game Saver — Ultra Fixed Edition
       - Comfortaa font, rounded edges, glassmorphism, gradients
       - Fixed overlapping with proper scroll behaviors
       - Responsive grid: stacks on narrow screens
       - LocalStorage-powered library with preview, export/import
       - Save from link, inject from storage, restore from file
       ============================================================ */

    :root {
      --bg1: #0f2027;
      --bg2: #203a43;
      --bg3: #2c5364;
      --acc1: #ff8c00;
      --acc2: #ff0080;
      --acc3: #00d4ff;
      --glass: rgba(255,255,255,0.08);
      --glass-2: rgba(255,255,255,0.12);
      --border: rgba(255,255,255,0.2);
      --soft: rgba(255,255,255,0.06);
      --text: #ffffff;
      --muted: #cfd8dc;
      --muted-2: #9aa7ad;
      --ok: #2ee59d;
      --warn: #ffd166;
      --err: #ff4d6d;
      --shadow: rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: 'Comfortaa', sans-serif;
      color: var(--text);
      background:
        radial-gradient(1200px 600px at 5% 10%, rgba(255,255,255,0.05), transparent 60%),
        linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-y: auto; /* allow whole page scroll */
    }

    /* Ambient overlay grid for subtle motion */
    .ambient-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.07) 1px, transparent 1px);
      background-size: 44px 44px;
      opacity: 0.08;
      animation: gridShift 24s linear infinite;
      z-index: 0;
    }

    @keyframes gridShift {
      0% { background-position: 0 0, 0 0; }
      100% { background-position: 44px 44px, 44px 44px; }
    }

    /* Main card container with scroll-friendly layout */
    .card {
      position: relative;
      z-index: 1;
      width: 1100px;
      max-width: calc(100% - 32px);
      border-radius: 28px;
      padding: 28px;
      margin: 24px 16px;
      background: linear-gradient(180deg, var(--glass), var(--soft));
      border: 2px solid var(--border);
      box-shadow:
        0 40px 80px var(--shadow),
        inset 0 1px 0 rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      animation: fadeIn 1200ms ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(18px) scale(0.992); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background: conic-gradient(from 180deg at 50% 50%, var(--acc1), var(--acc2), var(--acc3), var(--acc1));
      box-shadow: 0 12px 24px rgba(0,0,0,0.35);
      border: 2px solid var(--border);
      position: relative;
    }

    .logo::after {
      content: "O&B";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 14px;
      color: #111;
      text-shadow: 0 1px 0 rgba(255,255,255,0.5);
    }

    .title {
      font-size: 28px;
      line-height: 1.2;
      background: linear-gradient(90deg, var(--acc1), var(--acc2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(255,0,128,0.35);
      animation: titleGlow 6s ease-in-out infinite;
    }

    @keyframes titleGlow {
      0%   { text-shadow: 0 0 10px rgba(255,140,0,0.35); }
      50%  { text-shadow: 0 0 18px rgba(255,0,128,0.45); }
      100% { text-shadow: 0 0 10px rgba(255,140,0,0.35); }
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .chip {
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.06);
      color: var(--muted);
      font-size: 12px;
    }

    .gradient-line {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--acc2), transparent);
      opacity: 0.5;
      margin: 8px 0 18px;
    }

    /* Content grid with fixed overflow behaviors */
    .content-grid {
      display: grid;
      grid-template-columns: 1.25fr 0.85fr;
      gap: 16px;
      align-items: start;
    }

    @media (max-width: 980px) {
      .content-grid {
        grid-template-columns: 1fr; /* stack panels to avoid overlap */
      }
    }

    .panel {
      border-radius: 22px;
      padding: 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
      max-height: 70vh;
      overflow-y: auto; /* each panel scrolls independently */
    }

    .panel h2 {
      margin: 0 0 12px 0;
      font-size: 16px;
      letter-spacing: 0.6px;
      color: var(--muted);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
    .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }

    .field {
      width: 100%;
      height: 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.08);
      padding: 0 14px;
      color: var(--text);
      outline: none;
      transition: box-shadow 160ms ease, transform 160ms ease, border-color 160ms ease;
    }

    .field::placeholder { color: var(--muted-2); }
    .field:focus {
      border-color: rgba(255,0,128,0.55);
      box-shadow: 0 0 0 3px rgba(255,0,128,0.18);
      transform: translateY(-1px);
    }

    .btn {
      height: 44px;
      min-width: 160px;
      padding: 0 16px;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      letter-spacing: 0.4px;
      color: #111;
      cursor: pointer;
      background: linear-gradient(90deg, var(--acc1), var(--acc2));
      box-shadow:
        0 8px 24px rgba(255,0,128,0.25),
        inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform 140ms ease, box-shadow 140ms ease, filter 180ms ease;
    }
    .btn:hover { transform: translateY(-1px) scale(1.02); }
    .btn:active { transform: translateY(0) scale(0.995); filter: brightness(0.95); }

    .btn-secondary {
      background: linear-gradient(90deg, #b0bec5, #eceff1);
      box-shadow: 0 8px 24px rgba(176,190,197,0.25), inset 0 1px 0 rgba(255,255,255,0.6);
    }

    .status {
      margin-top: 8px;
      min-height: 24px;
      font-size: 13px;
      color: var(--muted);
    }
    .ok { color: var(--ok); }
    .warn { color: var(--warn); }
    .err { color: var(--err); }

    .library {
      margin-top: 8px;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      padding: 12px;
      max-height: 50vh;
      overflow-y: auto; /* library list scrolls independently */
    }

    .lib-tools {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
      margin-bottom: 10px;
      align-items: center;
    }

    .list { display: grid; gap: 8px; }

    .entry {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr auto;
      gap: 8px;
      align-items: center;
      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid var(--border);
      padding: 10px;
    }

    .entry .meta { font-size: 12px; color: var(--muted); }

    .entry .actions { display: flex; gap: 8px; }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.07);
      font-size: 12px;
      color: var(--muted);
    }

    .footer {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    /* Modal preview (scroll-safe) */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      background: rgba(0,0,0,0.45);
      z-index: 99;
      overflow: auto;
      padding: 24px;
    }
    .modal.open { display: grid; }

    .modal-card {
      width: 880px;
      max-width: calc(100% - 36px);
      border-radius: 24px;
      background: linear-gradient(180deg, var(--glass), var(--soft));
      border: 2px solid var(--border);
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
      backdrop-filter: blur(12px);
      overflow: hidden;
      animation: modalUp 300ms ease both;
    }

    @keyframes modalUp {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-body {
      padding: 12px;
      background: rgba(255,255,255,0.06);
    }

    iframe.preview {
      width: 100%;
      height: 520px;
      background: #111;
      border: none;
      border-radius: 16px;
    }

    /* Subtle pulse for logo */
    .pulse { animation: pulse 4.8s ease-in-out infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255,0,128,0.2); }
      50% { box-shadow: 0 0 0 6px rgba(255,0,128,0.05); }
      100% { box-shadow: 0 0 0 0 rgba(255,0,128,0.2); }
    }

    /* Filler classes to pad lines safely */
    .f1{opacity:1}.f2{opacity:1}.f3{opacity:1}.f4{opacity:1}.f5{opacity:1}
    .f6{opacity:1}.f7{opacity:1}.f8{opacity:1}.f9{opacity:1}.f10{opacity:1}
    .f11{opacity:1}.f12{opacity:1}.f13{opacity:1}.f14{opacity:1}.f15{opacity:1}
    .f16{opacity:1}.f17{opacity:1}.f18{opacity:1}.f19{opacity:1}.f20{opacity:1}
    .f21{opacity:1}.f22{opacity:1}.f23{opacity:1}.f24{opacity:1}.f25{opacity:1}
    .f26{opacity:1}.f27{opacity:1}.f28{opacity:1}.f29{opacity:1}.f30{opacity:1}
  </style>
</head>
<body>
  <div class="ambient-grid"></div>

  <main class="card">
    <div class="header">
      <div class="brand">
        <div class="logo pulse"></div>
        <div class="title">O&B Game Saver — Exclusive Launcher</div>
      </div>
      <div class="header-actions">
        <!-- Back to Main Site button -->
<button onclick="window.location.href='index.html'" 
        style="background-color:#87CEFA; color:black; padding:10px 20px; border:none; border-radius:5px; cursor:pointer;">
  Back to Main Site
</button>
        <span class="chip">Local-first</span>
        <span class="chip">Comfortaa UI</span>
        <span class="chip">Offline Library</span>
      </div>
    </div>

    <div class="gradient-line"></div>

    <section class="content-grid">
      <!-- Left: Actions -->
      <div class="panel">
        <h2>Save from link</h2>
        <div class="row">
          <input class="field" id="urlInput" placeholder="https://example.github.io/game or any static page">
          <button class="btn" id="btnSaveLink">Save & Download</button>
        </div>
        <div class="row-2">
          <input class="field" id="tagsInput" placeholder="Add tags (comma separated)">
          <input class="field" id="titleInput" placeholder="Optional title for this entry">
        </div>
        <div class="status" id="statusSave"></div>

        <div class="gradient-line"></div>

        <h2>Inject from storage</h2>
        <div class="row">
          <input class="field" id="injectLink" placeholder="Paste exact link you saved before">
          <button class="btn" id="btnInject">Inject & Download</button>
        </div>
        <div class="status" id="statusInject"></div>

        <div class="gradient-line"></div>

        <h2>Upload file to restore live site</h2>
        <div class="row">
          <input class="field" type="file" id="fileInput" accept=".html">
          <button class="btn btn-secondary" id="btnRestore">Restore Website Version</button>
        </div>
        <div class="status" id="statusRestore"></div>

        <div class="gradient-line"></div>

        <h2>Tools</h2>
        <div class="row-3">
          <button class="btn btn-secondary" id="btnExport">Export Library</button>
          <button class="btn btn-secondary" id="btnImport">Import Library</button>
          <button class="btn btn-secondary" id="btnClear">Clear Library</button>
        </div>
        <div class="status" id="statusTools"></div>
      </div>

      <!-- Right: Library -->
      <div class="panel">
        <h2>Saved games library</h2>

        <div class="lib-tools">
          <input class="field" id="searchInput" placeholder="Search by title, link, or tags">
          <button class="btn btn-secondary" id="btnRefresh">Refresh</button>
          <button class="btn btn-secondary" id="btnPreviewSelected">Preview</button>
        </div>

        <div class="library" id="libraryPane">
          <div class="list" id="libraryList"></div>
        </div>
        <div class="status" id="statusLibrary"></div>

        <div class="footer">
          <span>Your saves persist in localStorage. Export to share or back up.</span>
          <span class="pill"><span>Items:</span><strong id="countPill">0</strong></span>
        </div>
      </div>
    </section>
  </main>

  <!-- Modal for preview -->
  <div class="modal" id="modal">
    <div class="modal-card">
      <div class="modal-header">
        <strong>Preview saved content</strong>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-secondary" id="btnModalDownload">Download</button>
          <button class="btn" id="btnModalClose">Close</button>
        </div>
      </div>
      <div class="modal-body">
        <iframe class="preview" id="previewFrame" sandbox="allow-scripts allow-forms"></iframe>
      </div>
    </div>
  </div>

  <script>
    /* ============================================================
       Logic
       ============================================================ */

    const STORAGE_KEY = 'gameLibrary.v3';

    const $ = (id) => document.getElementById(id);
    const status = (el, msg, type = '') => {
      el.textContent = msg;
      el.classList.remove('ok','warn','err');
      if (type) el.classList.add(type);
    };

    const makeId = () => 'g_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

    const readLib = () => {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch { return []; }
    };

    const writeLib = (arr) => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
        return true;
      } catch { return false; }
    };

    const updateCount = () => {
      $('countPill').textContent = String(readLib().length);
    };

    const formatDate = (d = new Date()) => d.toLocaleString();

    const injectFooter = (html, dateStr, srcLink, label = 'Saved on') => {
      const footer = `
        <div style="position:fixed;bottom:10px;right:10px;color:#9aa7ad;font-size:12px;
        background:rgba(0,0,0,0.35);padding:6px 10px;border-radius:10px;border:1px solid rgba(255,255,255,0.18);backdrop-filter: blur(6px);z-index:999999;">
          ${label} ${dateStr}<br>Source: ${srcLink}
        </div>`;
      if (html.includes('</body>')) return html.replace('</body>', footer + '</body>');
      return html + footer;
    };

    const downloadText = (text, filename = 'saved-game.html', type = 'text/html') => {
      const blob = new Blob([text], {type});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        URL.revokeObjectURL(a.href);
        a.remove();
      }, 0);
    };

    const pickSourceLink = (html) => {
      // Try canonical, base href, and generic URLs
      const patterns = [
        /<link[^>]+rel=["']?canonical["']?[^>]*href=["']([^"']+)["']/i,
        /<base[^>]+href=["']([^"']+)["']/i,
        /https?:\/\/[^\s"'<>]+/i
      ];
      for (const p of patterns) {
        const m = html.match(p);
        if (!m) continue;
        if (m[1]) return m[1];
        if (m[0]) return m[0];
      }
      return null;
    };

    const renderLibrary = (filter = '') => {
      const lib = readLib();
      const list = $('libraryList');
      list.innerHTML = '';
      const q = filter.trim().toLowerCase();

      const filtered = q
        ? lib.filter(item => {
            const hay = [item.title, item.link, item.tags?.join(' ')].filter(Boolean).join(' ').toLowerCase();
            return hay.includes(q);
          })
        : lib;

      filtered.forEach(item => {
        const row = document.createElement('div');
        row.className = 'entry';
        row.dataset.id = item.id;

        const info = document.createElement('div');
        const title = item.title || '(untitled)';
        info.innerHTML = `<div><strong>${title}</strong><br><span class="meta">${item.link}</span></div>`;

        const meta = document.createElement('div');
        const tags = (item.tags || []).map(t => `#${t}`).join(' ') || '—';
        meta.innerHTML = `
          <div class="pill"><span>Saved:</span> ${item.date}</div>
          <div class="pill"><span>Tags:</span> ${tags}</div>
        `;

        const actions = document.createElement('div');
        actions.className = 'actions';

        const btnDl = document.createElement('button');
        btnDl.className = 'btn btn-secondary';
        btnDl.textContent = 'Download';
        btnDl.onclick = () => downloadText(item.content, (item.title || 'saved') + '.html');

        const btnPrev = document.createElement('button');
        btnPrev.className = 'btn btn-secondary';
        btnPrev.textContent = 'Preview';
        btnPrev.onclick = () => openPreview(item);

        const btnInject = document.createElement('button');
        btnInject.className = 'btn btn-secondary';
        btnInject.textContent = 'Re-inject';
        btnInject.onclick = () => {
          const injected = injectFooter(item.content, formatDate(), item.link, 'Re-injected on');
          downloadText(injected, (item.title || 'injected') + '.html');
        };

        const btnFetchLive = document.createElement('button');
        btnFetchLive.className = 'btn btn-secondary';
        btnFetchLive.textContent = 'Fetch live';
        btnFetchLive.onclick = async () => {
          status($('statusLibrary'), 'Fetching live site...', 'warn');
          try {
            const res = await fetch(item.link);
            const txt = await res.text();
            downloadText(txt, (item.title || 'restored-live') + '.html');
            status($('statusLibrary'), 'Restored live website version!', 'ok');
          } catch (e) {
            status($('statusLibrary'), 'Error: ' + e.message, 'err');
          }
        };

        const btnDelete = document.createElement('button');
        btnDelete.className = 'btn';
        btnDelete.textContent = 'Delete';
        btnDelete.onclick = () => {
          const lib2 = readLib().filter(x => x.id !== item.id);
          writeLib(lib2);
          renderLibrary(q);
          updateCount();
        };

        actions.append(btnDl, btnPrev, btnInject, btnFetchLive, btnDelete);
        row.append(info, meta, actions);
        list.appendChild(row);
      });

      updateCount();
      $('statusLibrary').textContent = filtered.length ? '' : 'No items found.';
    };

    let modalItem = null;

    const openPreview = (item) => {
      modalItem = item;
      const doc = new Blob([item.content], {type: 'text/html'});
      const url = URL.createObjectURL(doc);
      $('previewFrame').src = url;
      $('modal').classList.add('open');
    };

    const closePreview = () => {
      $('modal').classList.remove('open');
      $('previewFrame').src = 'about:blank';
      modalItem = null;
    };

    $('btnModalClose').addEventListener('click', closePreview);
    $('btnModalDownload').addEventListener('click', () => {
      if (!modalItem) return;
      downloadText(modalItem.content, (modalItem.title || 'previewed') + '.html');
    });

    $('btnSaveLink').addEventListener('click', async () => {
      const url = $('urlInput').value.trim();
      const tags = $('tagsInput').value.trim().split(',').map(s => s.trim()).filter(Boolean);
      const title = $('titleInput').value.trim();
      if (!url) return status($('statusSave'), 'Please enter a valid link.', 'warn');

      try {
        status($('statusSave'), 'Fetching content...', 'warn');
        const res = await fetch(url);
        const txt = await res.text();

        const dateStr = formatDate();
        const injected = injectFooter(txt, dateStr, url, 'Saved on');
        const lib = readLib();
        const id = makeId();

        lib.push({ id, title: title || url, link: url, date: dateStr, tags, content: injected });
        writeLib(lib);
        renderLibrary();
        status($('statusSave'), 'Game saved to library and downloaded.', 'ok');

        downloadText(injected, (title || 'saved-game') + '.html');
      } catch (e) {
        status($('statusSave'), 'Error: ' + e.message, 'err');
      }
    });

    $('btnInject').addEventListener('click', () => {
      const link = $('injectLink').value.trim();
      if (!link) return status($('statusInject'), 'Please enter a link.', 'warn');
      const lib = readLib();
      const item = lib.find(x => x.link === link);
      if (!item) return status($('statusInject'), 'No saved game found for that link.', 'warn');
      const dateStr = formatDate();
      const injected = injectFooter(item.content, dateStr, link, 'Injected on');
      downloadText(injected, (item.title || 'injected-game') + '.html');
      status($('statusInject'), 'Injected and downloaded!', 'ok');
    });

    $('btnRestore').addEventListener('click', () => {
      const input = $('fileInput');
      if (!input.files.length) return status($('statusRestore'), 'Please upload an HTML file.', 'warn');
      const file = input.files[0];
      const reader = new FileReader();
      reader.onload = async (e) => {
        const text = e.target.result;
        const original = pickSourceLink(text);
        if (!original) return status($('statusRestore'), 'Could not find original link in file.', 'warn');

        status($('statusRestore'), 'Fetching live site from ' + original + ' ...', 'warn');
        try {
          const res = await fetch(original);
          const liveText = await res.text();
          downloadText(liveText, 'restored-live.html');
          status($('statusRestore'), 'Restored live website version!', 'ok');
        } catch (err) {
          status($('statusRestore'), 'Error fetching live site: ' + err.message, 'err');
        }
      };
      reader.readAsText(file);
    });

    $('btnExport').addEventListener('click', () => {
      const lib = readLib();
      const json = JSON.stringify(lib, null, 2);
      downloadText(json, 'O&B-library.json', 'application/json');
      status($('statusTools'), 'Exported library JSON.', 'ok');
    });

    $('btnImport').addEventListener('click', async () => {
      const picker = document.createElement('input');
      picker.type = 'file';
      picker.accept = '.json,application/json';
      picker.onchange = () => {
        const f = picker.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (!Array.isArray(data)) throw new Error('Invalid format: expected array');
            writeLib(data);
            renderLibrary();
            status($('statusTools'), 'Imported library JSON.', 'ok');
          } catch (err) {
            status($('statusTools'), 'Import failed: ' + err.message, 'err');
          }
        };
        reader.readAsText(f);
      };
      picker.click();
    });

    $('btnClear').addEventListener('click', () => {
      writeLib([]);
      renderLibrary();
      status($('statusTools'), 'Library cleared.', 'warn');
    });

    $('btnRefresh').addEventListener('click', () => {
      renderLibrary($('searchInput').value);
      status($('statusLibrary'), 'Library refreshed.', 'ok');
    });

    $('btnPreviewSelected').addEventListener('click', () => {
      const q = $('searchInput').value.trim().toLowerCase();
      const lib = readLib();
      const filtered = q
        ? lib.filter(item => {
            const hay = [item.title, item.link, item.tags?.join(' ')].filter(Boolean).join(' ').toLowerCase();
            return hay.includes(q);
          })
        : lib;
      if (!filtered.length) return status($('statusLibrary'), 'No items to preview.', 'warn');
      openPreview(filtered[0]);
    });

    $('searchInput').addEventListener('input', (e) => {
      renderLibrary(e.target.value);
    });

    // Initialize
    renderLibrary();
    updateCount();

    // Small maintenance: de-duplicate by link+title
    const dedupeLibrary = () => {
      const lib = readLib();
      const seen = new Set();
      const deduped = [];
      for (const item of lib) {
        const key = (item.link || '') + '|' + (item.title || '');
        if (seen.has(key)) continue;
        seen.add(key);
        deduped.push(item);
      }
      writeLib(deduped);
      renderLibrary($('searchInput').value);
      updateCount();
    };
    setTimeout(dedupeLibrary, 1200);

    // Tooltips for clarity
    const addHint = (el, txt) => el && (el.title = txt);
    addHint($('btnSaveLink'), 'Fetch a link, inject timestamp, save to library, and download');
    addHint($('btnInject'), 'Find a saved entry by its link and re-inject a fresh timestamp');
    addHint($('btnRestore'), 'Upload HTML, extract original source, fetch live site');
    addHint($('btnExport'), 'Export your library to JSON');
    addHint($('btnImport'), 'Import a JSON library');
    addHint($('btnClear'), 'Clear all saved entries');
    addHint($('btnRefresh'), 'Refresh and filter your library view');
    addHint($('btnPreviewSelected'), 'Preview the first filtered item');

    // End of logic
  </script>
